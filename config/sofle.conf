# Enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Use the nice_oled custom status screen (module: mctechnology17/zmk-nice-oled)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Let key transmission preempt OLED rendering on both halves.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10

# Disable automatic idle and deep sleep on both halves.
# ZMK v0.3 uses a signed 32-bit inactivity counter: INT32_MAX prevents
# the idle transition. Zero would trigger idle immediately.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=2147483647
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# Rotary encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Configuration pour couleur blanche au démarrage
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Disable external power toggling by the underglow
# This keeps the display on when changing RGB settings
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Extinction automatique du RGB quand alimenté par USB
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
