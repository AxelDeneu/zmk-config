# Central-only (left half) settings

# Keep the peripheral listening at every split connection event.
# The default connection interval remains 6 x 1.25 ms = 7.5 ms.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# Raw HID: Time + Volume + Layout (requires zmk-hid-host on the PC).
# Enabled here only — on the peripheral, NICE_OLED_WIDGET_RAW_HID_DRIVER
# implies USB_DEVICE_HID, which has nothing to bind to on the right half.
CONFIG_NICE_OLED_WIDGET_RAW_HID=y
